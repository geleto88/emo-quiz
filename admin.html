<!doctype html><html lang="bg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Администрация – Емо</title><link rel="stylesheet" href="style.css"><main><h1>Административен панел</h1><form id="login"><label>Имейл<input id="email" type="email" required></label><label>Парола<input id="password" type="password" required></label><button>Вход</button></form><p id="msg" role="status"></p><div id="panel" hidden><button id="logout">Изход</button><section><h2>Настройки</h2><form id="settings"><label>Начало (местно време)<input id="start_date" type="datetime-local"></label><label>Край (местно време)<input id="end_date" type="datetime-local"></label><div id="fields"></div><button>Запази настройки</button></form></section><section><h2>Промяна на парола</h2><form id="pw"><select id="pwmode"><option value="test">Тестова</option><option value="official">Официална</option></select><label>Нова парола<input id="newpw" type="password" minlength="7" required></label><button>Промени</button></form></section><section><h2>Въпроси</h2><select id="mode"><option value="test">Тестови</option><option value="official">Официални</option></select><form id="qform"><label>Номер<input id="position" type="number" min="1" max="100" required></label><label>Въпрос<textarea id="question_text" required></textarea></label><div id="opts"></div><label>Верен отговор<select id="correct_answer"><option>A</option><option>B</option><option>C</option><option>D</option></select></label><button>Запази въпрос</button><button type="button" id="clear">Нов въпрос</button></form><div id="questions"></div></section><section><h2>Резултати</h2><select id="rmode"><option value="official">Официални</option><option value="test">Тестови</option></select><button id="refresh">Зареди</button><button id="export">Excel (.xlsx)</button><div class="scroll"><table id="results"></table></div><div style="margin-top:24px;border-top:1px solid #aaa;padding-top:16px"><h3>Управление на резултатите</h3><p>Изтриването е необратимо. Първо експортирайте резултатите в Excel и деактивирайте съответния режим.</p><button type="button" id="delete_test" style="background:#b91c1c;color:white;margin:4px 0">Изчисти тестовите резултати</button><button type="button" id="delete_official" style="background:#b91c1c;color:white;margin:4px 0">Изчисти официалните резултати</button><p id="delete_status" role="status" aria-live="polite"></p></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="config.js"></script><script>
const nums={duration_minutes:'Официални минути',question_count:'Официални въпроси',test_duration_minutes:'Тестови минути',test_question_count:'Тестови въпроси'},flags={is_active:'Официален активен',test_is_active:'Тестов активен',shuffle_questions:'Разбъркай въпросите',shuffle_answers:'Разбъркай отговорите'};for(const [k,v] of Object.entries({...nums,...flags})){let l=document.createElement('label'),i=document.createElement('input');i.id=k;i.type=k in nums?'number':'checkbox';if(k in nums){i.min=1;i.required=true}l.append(v,i);$('fields').append(l)}for(const c of 'abcd'){let l=document.createElement('label'),i=document.createElement('input');i.id='option_'+c;i.required=true;l.append('Отговор '+c.toUpperCase(),i);$('opts').append(l)}let editing=null,rows=[];const msg=m=>$('msg').textContent=m;function wrap(fn){return async e=>{e?.preventDefault();try{await fn(e)}catch(e){msg(e.message)}}}function local(v){if(!v)return '';let d=new Date(v);return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}async function settings(){let s=await rpc('admin_get_quiz_settings');for(const k in nums)$(k).value=s[k];for(const k in flags)$(k).checked=s[k];for(const k of ['start_date','end_date'])$(k).value=local(s[k])}async function enter(){if(!await rpc('is_quiz_admin'))throw Error('Нямате административни права.');$('login').hidden=true;$('panel').hidden=false;await settings();await questions()}$('login').onsubmit=wrap(async()=>{let {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)throw error;$('password').value='';await enter()});$('logout').onclick=wrap(async()=>{await db.auth.signOut();location.reload()});$('settings').onsubmit=wrap(async()=>{let a={};for(const k in nums)a['p_'+k]=Number($(k).value);for(const k in flags)a['p_'+k]=$(k).checked;for(const k of ['start_date','end_date'])a['p_'+k]=$(k).value?new Date($(k).value).toISOString():null;msg((await rpc('admin_update_quiz_settings',a)).message)});$('pw').onsubmit=wrap(async()=>{msg((await rpc('admin_set_quiz_password',{p_mode:$('pwmode').value,p_password:$('newpw').value})).message);$('newpw').value=''});const keys=['position','question_text','option_a','option_b','option_c','option_d','correct_answer'];function clear(){editing=null;$('qform').reset()}$('clear').onclick=clear;async function questions(){let {data,error}=await db.from('questions').select('*').eq('quiz_mode',$('mode').value).order('position');if(error)throw error;$('questions').replaceChildren();for(const q of data){let p=document.createElement('p'),b=document.createElement('button');b.textContent='Редактирай';b.onclick=()=>{editing=q.id;for(const k of keys)$(k).value=q[k]};p.append(q.position+'. '+q.question_text+' ',b);$('questions').append(p)}}$('mode').onchange=wrap(async()=>{clear();await questions()});$('qform').onsubmit=wrap(async()=>{let q={quiz_mode:$('mode').value};for(const k of keys)q[k]=k==='position'?Number($(k).value):$(k).value;let {error}=await(editing?db.from('questions').update(q).eq('id',editing):db.from('questions').insert(q));if(error)throw error;clear();await questions();msg('Въпросът е запазен.')});async function results(){rows=await rpc('admin_get_quiz_results',{p_mode:$('rmode').value});let t=$('results');t.replaceChildren();for(const r of [['Имена','Имейл','Верни','Секунди','Статус','Смени на таб'],...rows.map(p=>[p.full_name,p.email,p.correct_answers,p.duration_seconds,p.status,p.tab_switches])]){let tr=t.insertRow();for(const v of r)tr.insertCell().textContent=v??''}}$('refresh').onclick=wrap(results);const exportDate=new Intl.DateTimeFormat('bg-BG',{timeZone:'Europe/Sofia',day:'2-digit',month:'2-digit',year:'numeric'});
const exportTime=new Intl.DateTimeFormat('bg-BG',{timeZone:'Europe/Sofia',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
function exportFormat(v,f){return v&&Number.isFinite(new Date(v).getTime())?f.format(new Date(v)):''}
$('export').onclick=wrap(async()=>{
 await results();
 const sorted=[...rows].sort((a,b)=>(b.correct_answers??0)-(a.correct_answers??0)||(a.duration_seconds??Infinity)-(b.duration_seconds??Infinity));
 const count=Math.max(30,...sorted.map(p=>p.question_order?.length||0));
 const headers=['Място','Имена','Имейл','Дата начало','Начало','Дата край','Край','Секунди','Верни','Грешни','Неотговорени','Статус','Смени на таб',...Array.from({length:count},(_,i)=>'Въпрос '+(i+1))];
 const statuses={completed:'Завършен',expired:'Изтекло време',in_progress:'В процес',active:'В процес'};
 let rank=0;
 const out=sorted.map((p,i)=>{
 const prev=sorted[i-1];if(!prev||prev.correct_answers!==p.correct_answers||prev.duration_seconds!==p.duration_seconds)rank=i+1;
 let r={'Място':rank,'Имена':p.full_name,'Имейл':p.email,'Дата начало':exportFormat(p.started_at,exportDate),'Начало':exportFormat(p.started_at,exportTime),'Дата край':exportFormat(p.finished_at,exportDate),'Край':exportFormat(p.finished_at,exportTime),'Секунди':p.duration_seconds,'Верни':p.correct_answers,'Грешни':p.wrong_answers,'Неотговорени':p.unanswered,'Статус':statuses[p.status]||p.status,'Смени на таб':p.tab_switches};
 for(let n=1;n<=count;n++){let a=(p.answers||[]).find(a=>a.question_position===n);r['Въпрос '+n]=a?`${a.selected_answer} (${a.is_correct?'верен':'грешен'})`:''}return r});
 const sheet=XLSX.utils.json_to_sheet(out,{header:headers});
 sheet['!cols']=headers.map(h=>({wch:Math.min(65,Math.max(h.length,...out.map(r=>String(r[h]??'').length))+3)}));
 sheet['!autofilter']={ref:sheet['!ref']};
 let w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,sheet,'Резултати');XLSX.writeFile(w,'emo-'+$('rmode').value+'.xlsx');
 });
let deleting=false;
async function deleteResults(mode){
 if(deleting)return;
 const label=mode==='test'?'ТЕСТОВИЯ':'ОФИЦИАЛНИЯ';
 const status=$('delete_status');
 const buttons=[$('delete_test'),$('delete_official')];
 deleting=true;buttons.forEach(b=>b.disabled=true);
 try{
  status.textContent='';
  const settings=await rpc('admin_get_quiz_settings');
  if(settings[mode==='test'?'test_is_active':'is_active']!==false)throw Error('Първо деактивирайте съответния режим и запазете настройките.');
  if(!confirm('Ще изтриете всички участници, отговори и събития от '+label+' режим. Действието е необратимо. Продължавате ли?'))return;
  const confirmation=prompt('За окончателно изтриване на резултатите от '+label+' режим въведете ИЗТРИЙ:');
  if(confirmation!=='ИЗТРИЙ'){status.textContent='Изтриването е отменено.';return;}
  const r=await rpc(mode==='test'?'admin_clear_test_results':'admin_clear_official_results',{p_confirmation:confirmation});
  if(r?.success!==true)throw Error('Изтриването не е потвърдено от сървъра.');
  status.textContent='Изтрити от '+label+' режим: '+r.deleted_participants+' участници, '+r.deleted_answers+' отговора, '+r.deleted_events+' събития.';
  $('rmode').value=mode;rows=[];$('results').replaceChildren();
  try{await results()}catch(e){status.textContent+=' Таблицата не се обнови: '+e.message;}
 }catch(e){status.textContent=e.message;}
 finally{deleting=false;buttons.forEach(b=>b.disabled=false);}
}
$('delete_test').onclick=()=>deleteResults('test');
$('delete_official').onclick=()=>deleteResults('official');
db.auth.getSession().then(({data})=>{if(data.session)enter().catch(e=>msg(e.message))});
</script></html>
